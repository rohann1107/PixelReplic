<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SaaSify — Modern Cloud Platform</title>
  <style>
    body {
      background-color: #FFFFFF;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 40px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid #E2E8F0;
    }
    h1 {
      font-size: 44px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
    }
    .cta-btn {
      background-color: #4F46E5;
      color: #FFFFFF;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .pricing-card {
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 24px;
      margin-top: 32px;
      width: 300px;
      background: #F8FAFC;
    }
  </style>
</head>
<body>
  <header>
    <div><strong>SaaSify</strong></div>
    <button class="cta-btn">Sign In</button>
  </header>
  <main>
    <h1>Build software faster than ever</h1>
    <p>Streamlined cloud primitives designed for rapid application engineering.</p>
    <div class="pricing-card">
      <h3>Pro Tier</h3>
      <p>$49 / month</p>
      <button class="cta-btn">Get Started</button>
    </div>
  </main>
</body>
</html>
