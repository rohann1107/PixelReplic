<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ripplier — Creative Idea Engine</title>
  <style>
    body {
      background-color: #0D0D11;
      color: #F5F2EB;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 48px;
      color: #F5F2EB;
      line-height: 1.2;
    }
    .niche-badge {
      background-color: #1A1A22;
      color: #E0693B;
      font-family: 'JetBrains Mono', monospace;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      display: inline-block;
    }
    .lever-container {
      background-color: #16161D;
      border: 1px solid #2B2B38;
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
      width: 320px;
    }
    .spin-btn {
      background-color: #E0693B;
      color: #0D0D11;
      font-weight: 700;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }
    .timer-btn {
      background-color: transparent;
      color: #F5F2EB;
      border: 1px solid #444455;
      padding: 12px 24px;
      border-radius: 12px;
      margin-left: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="niche-badge">CREATIVE NICHE: ARCHITECTURE & DESIGN</div>
  </header>
  <main>
    <h1>Ripplier Editorial Experience</h1>
    <p>Generate unexpected sparks for your next breakthrough concept.</p>
    <div class="lever-container" role="switch" aria-label="Interactive Lever Control">
      <span>Lever Mode: Active</span>
    </div>
    <div style="margin-top: 24px;">
      <button class="spin-btn">SPIN SEED!</button>
      <button class="timer-btn">START TIMER</button>
    </div>
  </main>
</body>
</html>
